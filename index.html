  return {

  if(configured){
    try{const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm');supabase=m.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{autoRefreshToken:true,persistSession:true}});const {data:{session}}=await supabase.auth.getSession();if(session){await loadData();if(passwordFlow)modalPassword();return}}

async function loadData(){
  if(state.demo){state.me=state.data.k32_profiles.find(p=>p.id===state.me.id)||null;render();return}
  state.loading=true;
  try{
    const {data:{user},error:authErr}=await supabase.auth.getUser();if(authErr||!user){state.me=null;renderLogin();return}
    const me=await supabase.from('k32_profiles').select('*').eq('id',user.id).maybeSingle();
    if(me.error)throw me.error;
    if(!me.data?.active){await supabase.auth.signOut();state.me=null;renderLogin('Je account is nog niet geactiveerd of is uitgeschakeld.');return}
    state.me=me.data;
    const results=await Promise.all(tables.map(t=>supabase.from(t).select('*')));
    results.forEach((r,i)=>{if(r.error)throw new Error(`${tables[i]}: ${r.error.message}`);state.data[tables[i]]=r.data||[]});
    state.me=state.data.k32_profiles.find(p=>p.id===user.id)||me.data;
    render();
  }catch(e){console.error(e);toast(`Ophalen mislukt: ${e.message}`,true);render();}finally{state.loading=false}
}

const sel=(label,n,opts,current)=>`<label>${h(label)}<select name="${n}">${opts.map(([v,l])=>`<option value="${h(v)}" ${String(current??'')===String(v)?'selected':''}>${h(l)}</option>`).join('')}</select></label>`;
const textArea=(label,n,v='')=>`<label class="span2">${h(label)}<textarea name="${n}">${h(v)}</textarea></label>`;
const dateParts=(v)=>{const d=v?new Date(v):new Date();return {date:day(d),time:d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',hour12:false})}};
const leaders=()=>state.data.k32_profiles.filter(p=>p.active&&['manager','admin'].includes(p.role));
function modalHours(x){const a=dateParts(x?.start_at),b=dateParts(x?.end_at);const userOptions=state.data.k32_profiles.filter(p=>p.active).map(p=>[p.id,p.full_name]);const opts=leaders().map(p=>[p.id,p.full_name]);openDialog(x?'Dienst wijzigen':'Uren registreren','Voer begin- en eindtijd in. Een dienst na middernacht wordt automatisch de volgende dag afgerond.',`
 ${leader()?sel('Medewerker','user_id',userOptions,x?.user_id||uid()):''}${field('Datum','date','date',a.date,'required')}${field('Begintijd','start','time',x?a.time:'17:00','required')}${field('Eindtijd','end','time',x?b.time:'23:00','required')}${field('Pauze (min)','break_minutes','number',x?.break_minutes??0,'min="0" max="1440" required')}${sel('Ter controle naar','reviewer_id',opts,x?.reviewer_id||opts.find(x=>x[0]!==uid())?.[0]||opts[0]?.[0])}${textArea('Opmerking / werkzaamheden','note',x?.note)}${x?`<input type="hidden" name="id" value="${h(x.id)}">`:''}`,'hours',x?'Wijzigingen opslaan':'Uren indienen');}
function modalTask(x){const users=[['','Hele team'],...state.data.k32_profiles.filter(p=>p.active).map(p=>[p.id,p.full_name])];openDialog(x?'Taak bewerken':'Nieuwe taak','Een taak kan voor een persoon of voor het hele team zijn.',`${field('Taak','title','text',x?.title,'required maxlength="140"')}${sel('Categorie','category',['Bar','Keuken','Zaal & terras','Hygiëne','Evenement','Algemeen'].map(c=>[c,c]),x?.category||'Algemeen')}${sel('Toewijzen aan','assigned_to',users,x?.assigned_to||'')}${sel('Prioriteit','priority',[['normal','Normaal'],['high','Hoog']],x?.priority||'normal')}${field('Uiterlijk','due_date','date',x?.due_date||day())}${textArea('Toelichting','description',x?.description)}${x?`<input type="hidden" name="id" value="${h(x.id)}">`:''}`,'task');}
function modalOrder(x){openDialog(x?'Bestelling wijzigen':'Product toevoegen','Meld wat aangevuld of ingekocht moet worden.',`${field('Product','item','text',x?.item,'required maxlength="150" list="orderSuggest"')}<datalist id="orderSuggest">${ordersSuggest.map(x=>`<option value="${h(x)}"></option>`).join('')}</datalist>${sel('Categorie','category',categories.map(c=>[c,c]),x?.category||categories[0])}${field('Aantal','quantity','number',x?.quantity??1,'required min="0.01" max="100000" step="0.01"')}${sel('Eenheid','unit',['stuk','doos','krat','fles','zak','pak','liter','kg','tray'].map(x=>[x,x]),x?.unit||'stuk')}${x?sel('Status','status',[['requested','Aangevraagd'],['ordered','Besteld'],['received','Ontvangen']],x.status):''}${textArea('Toelichting','note',x?.note)}${x?`<input type="hidden" name="id" value="${h(x.id)}">`:''}`,'order',x?'Bestelling opslaan':'Toevoegen');}
function modalChecklist(x){openDialog(x?'Checklist bewerken':'Nieuwe checklist','Dagelijks resetten per kalenderdag of wekelijks op maandag.',`${field('Titel','title','text',x?.title,'required maxlength="120"')}${sel('Afdeling','category',['Bar','Keuken','Zaal & terras','Hygiëne','Sluiting','Algemeen'].map(x=>[x,x]),x?.category||'Algemeen')}${sel('Moment','shift',[['opening','Opening'],['service','Service'],['closing','Sluiting'],['weekly','Wekelijks']],x?.shift||'opening')}${sel('Herhaling','frequency',[['daily','Dagelijks'],['weekly','Wekelijks']],x?.frequency||'daily')}${x?`<input type="hidden" name="id" value="${h(x.id)}">`:''}`,'checklist');}
function modalEditCheckItem(item){openDialog('Controlepunt bewerken','Werk de tekst bij of schakel dit controlepunt uit.',`${field('Controlepunt','title','text',item.title,'required maxlength="240"')}${sel('Status','active',[['true','Actief'],['false','Verbergen']],String(item.active))}<input type="hidden" name="id" value="${h(item.id)}">`,'editcheckitem');}
function modalCheckItem(tpl){openDialog('Controlepunt toevoegen','Voeg een stap toe aan de geselecteerde checklist.',`${field('Controlepunt','title','text','','required maxlength="240"')}<input type="hidden" name="template_id" value="${h(tpl.id)}">`,'checkitem');}
function modalPerson(p){if(p.role==='admin'&&state.me.role!=='admin')return;const roles=state.me.role==='admin'?[['staff','Medewerker'],['manager','Leidinggevende'],['admin','Admin']]:[['staff','Medewerker'],['manager','Leidinggevende']];const checks=caps.map(([key,label])=>`<label><input type="checkbox" name="perm_${key}" ${p.permissions?.[key]?'checked':''}>${h(label)}</label>`).join('');openDialog('Rechten aanpassen',p.full_name,`${field('Naam','full_name','text',p.full_name,'required maxlength="100"')}${sel('Rol','role',roles,p.role)}${sel('Accountstatus','active',[['true','Actief'],['false','Geblokkeerd']],String(p.active))}<div class="span2"><p class="info-text">Extra rechten voor medewerkers (leidinggevenden hebben deze standaard):</p><div class="permission-grid">${checks}</div></div><input type="hidden" name="id" value="${h(p.id)}">`,'person');}
function modalPassword(){openDialog('Wachtwoord instellen','Kies een uniek wachtwoord van minstens 10 tekens.',`${field('Nieuw wachtwoord','password','password','','required minlength="10" autocomplete="new-password"')}${field('Herhaal wachtwoord','confirm','password','','required minlength="10" autocomplete="new-password"')}`,'password','Wachtwoord opslaan');}
function modalInvite(){openDialog('Medewerker uitnodigen','Een uitnodigingsmail met een persoonlijke activatielink wordt verzonden.',`${field('Naam','full_name','text','','required maxlength="100"')}${field('E-mailadres','email','email','','required')}${state.me.role==='admin'?sel('Rol','role',[['staff','Medewerker'],['manager','Leidinggevende']],'staff'):''}`,'invite','Uitnodiging versturen');}
async function save(table,record,id){if(state.demo){const arr=state.data[table];if(id){const pos=arr.findIndex(x=>x.id===id);arr[pos]={...arr[pos],...record}}else{arr.push({id:crypto.randomUUID(),created_at:new Date().toISOString(),...record})}persistDemo();render();return}
 const req=id?supabase.from(table).update(record).eq('id',id):supabase.from(table).insert(record);
 const {error}=await req;if(error)throw error;await loadData();}
async function destroy(table,id){if(state.demo){state.data[table]=state.data[table].filter(x=>x.id!==id);persistDemo();render();return}const {error}=await supabase.from(table).delete().eq('id',id);if(error)throw error;await loadData();}
const asISO=(d,time,extra=0)=>{const x=new Date(`${d}T${time}:00`);x.setDate(x.getDate()+extra);return x.toISOString()};
async function handleModal(form){const f=new FormData(form);const o=Object.fromEntries(f.entries());const id=o.id;delete o.id;
 if(form.dataset.form==='password'){
  if(state.demo){toast('In demo worden geen echte wachtwoorden gebruikt.');return}
  if(o.password!==o.confirm)throw new Error('De twee wachtwoorden verschillen.');
  if(o.password.length<10)throw new Error('Gebruik minstens 10 tekens.');
  const {error}=await supabase.auth.updateUser({password:o.password});if(error)throw error;toast('Wachtwoord opgeslagen.');return;
 }
 if(form.dataset.form==='hours'){
  let start=asISO(o.date,o.start),end=asISO(o.date,o.end);if(new Date(end)<=new Date(start))end=asISO(o.date,o.end,1);
  if((new Date(end)-new Date(start))/60000>24*60)throw new Error('Een dienst mag niet langer dan 24 uur zijn.');
  if(Number(o.break_minutes)>=(new Date(end)-new Date(start))/60000)throw new Error('De pauze moet korter zijn dan de dienst.');
  const old=state.data.k32_time_entries.find(x=>x.id===id);
  const x={user_id:old?.user_id||o.user_id||uid(),start_at:start,end_at:end,break_minutes:Number(o.break_minutes),reviewer_id:o.reviewer_id||null,note:o.note||'',status:leader()&&old?old.status:'submitted',submitted_at:old?.submitted_at||new Date().toISOString()};
  await save('k32_time_entries',x,id);
 }else if(form.dataset.form==='task'){
  const x={title:o.title,category:o.category,priority:o.priority,assigned_to:o.assigned_to||null,due_date:o.due_date||null,description:o.description||''};if(!id){x.status='open';x.created_by=uid()};await save('k32_tasks',x,id);
 }else if(form.dataset.form==='order'){
  const x={item:o.item,category:o.category,quantity:Number(o.quantity),unit:o.unit,note:o.note||''};if(id)x.status=o.status;else{x.status='requested';x.requested_by=uid()};await save('k32_orders',x,id);
 }else if(form.dataset.form==='checklist'){
  const x={title:o.title,category:o.category,shift:o.shift,frequency:o.frequency};if(!id){x.slug=`custom-${crypto.randomUUID().slice(0,12)}`;x.active=true};await save('k32_checklist_templates',x,id);
 }else if(form.dataset.form==='checkitem'){
  let list=state.data.k32_checklist_items.filter(x=>x.template_id===o.template_id);
  await save('k32_checklist_items',{title:o.title,template_id:o.template_id,position:Math.max(0,...list.map(x=>x.position))+1,active:true},null);
 }else if(form.dataset.form==='editcheckitem'){
  await save('k32_checklist_items',{title:o.title,active:o.active==='true'},id);
 }else if(form.dataset.form==='person'){
  let perms={};caps.forEach(([key])=>{perms[key]=f.get(`perm_${key}`)==='on'});
  await save('k32_profiles',{full_name:o.full_name,role:o.role,active:o.active==='true',permissions:perms},id);
 }else if(form.dataset.form==='invite'){
  if(state.demo){toast(`Demo: uitnodiging voor ${o.full_name} is niet echt verstuurd.`);return}
  const {data,error}=await supabase.functions.invoke('invite-staff',{body:{email:o.email,full_name:o.full_name,role:o.role||'staff',origin:window.location.origin+window.location.pathname.replace(/[^/]+$/,'')}});if(error)throw error;if(data?.error)throw new Error(data.error);await loadData();toast('Uitnodiging verzonden.');return;
 }
 toast('Opgeslagen.');
}
async function handleClick(el){const act=el.dataset.action;const id=el.dataset.id;try{
  if(act==='demo'){sessionStorage.setItem('k32_demo_user','d-admin');initDemo();return}
  if(act==='logout'){if(state.demo){state.demo=false;sessionStorage.removeItem('k32_demo_user');state.me=null;state.page='dashboard';renderLogin();return}await supabase.auth.signOut();state.me=null;renderLogin();return}
  if(act==='password'){modalPassword();return}
  if(act==='forgot'){const email=document.querySelector('input[name="email"]')?.value;if(!email)return toast('Vul eerst je e-mailadres in.',true);const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});if(error)throw error;toast('Als het adres bekend is, volgt een herstelmail.');return}
  if(act==='close-modal'){document.querySelector('.dialog-backdrop')?.remove();return}
  if(act==='new-hours')modalHours();if(act==='edit-hours')modalHours(state.data.k32_time_entries.find(x=>x.id===id));
  if(act==='new-task'&&can('manage_tasks'))modalTask();if(act==='edit-task'&&can('manage_tasks'))modalTask(state.data.k32_tasks.find(x=>x.id===id));
  if(act==='new-order')modalOrder();if(act==='edit-order'&&can('manage_orders'))modalOrder(state.data.k32_orders.find(x=>x.id===id));
  if(act==='new-checklist'&&can('manage_checklists'))modalChecklist();if(act==='edit-checklist'&&can('manage_checklists'))modalChecklist(state.data.k32_checklist_templates.find(x=>x.id===id));
  if(act==='add-checkitem'&&can('manage_checklists'))modalCheckItem(state.data.k32_checklist_templates.find(x=>x.id===id));if(act==='edit-checkitem'&&can('manage_checklists'))modalEditCheckItem(state.data.k32_checklist_items.find(x=>x.id===id));
  if(act==='invite'&&leader())modalInvite();if(act==='edit-person'&&leader())modalPerson(state.data.k32_profiles.find(x=>x.id===id));
  if(act==='toggle-task'){
   const t=state.data.k32_tasks.find(x=>x.id===id);if(!canToggleTask(t))return;await save('k32_tasks',{status:t.status==='done'?'open':'done',completed_at:t.status==='done'?null:new Date().toISOString()},id);toast('Taak bijgewerkt.');
  }
  if(act==='progress-order'&&can('manage_orders')){
   const o=state.data.k32_orders.find(x=>x.id===id);await save('k32_orders',{status:o.status==='requested'?'ordered':'received'},id);toast('Bestelling bijgewerkt.');
  }
  if((act==='approve'||act==='reject')&&can('approve_hours')){
   await save('k32_time_entries',{status:act==='approve'?'approved':'rejected',reviewed_by:uid(),reviewed_at:new Date().toISOString()},id);toast('Urenstatus bijgewerkt.');
  }
  if(act==='export-hours'&&can('view_all_hours')){
   const rows=[['Medewerker','Begintijd','Eindtijd','Pauze (min)','Gewerkte minuten','Status','Naar','Opmerking'],...state.data.k32_time_entries.map(x=>[name(x.user_id),new Date(x.start_at).toLocaleString('nl-NL'),new Date(x.end_at).toLocaleString('nl-NL'),x.break_minutes,minutes(x),pretty(x.status),name(x.reviewer_id),x.note||''])];
   const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`kade32-uren-${day()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV-export gedownload.');
  }
 }catch(e){console.error(e);toast(e.message||'Er is iets misgegaan.',true)}}

document.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;state.filter='all';render();return}const el=e.target.closest('[data-action]');if(el)await handleClick(el)});
document.addEventListener('submit',async e=>{if(e.target.id==='loginForm'){
 e.preventDefault();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;const f=new FormData(e.target);try{if(!supabase)throw new Error('Supabase is niet geconfigureerd.');const {error}=await supabase.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;state.page='dashboard';await loadData();}catch(err){toast('Inloggen mislukt. Controleer je gegevens en of je account geactiveerd is.',true);btn.disabled=false}return}
 if(e.target.id==='modalForm'){e.preventDefault();const b=e.target.querySelector('[type="submit"]');b.disabled=true;try{await handleModal(e.target);document.querySelector('.dialog-backdrop')?.remove()}catch(err){console.error(err);toast(err.message||'Opslaan mislukt.',true)}finally{b.disabled=false}}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='demoUser'){sessionStorage.setItem('k32_demo_user',e.target.value);state.me=state.data.k32_profiles.find(x=>x.id===e.target.value);state.page='dashboard';render()}
 if(e.target.id==='statusFilter'){state.filter=e.target.value;render()}
 if(e.target.matches('[data-check-item]')){
  const cb=e.target;const item=cb.dataset.checkItem;const run_date=cb.dataset.runDate;const tick=state.data.k32_checklist_ticks.find(x=>x.item_id===item&&x.run_date===run_date);
  try{cb.disabled=true;if(cb.checked&&!tick){await save('k32_checklist_ticks',{item_id:item,run_date,checked_by:uid(),checked_at:new Date().toISOString()},null)}else if(!cb.checked&&tick){await destroy('k32_checklist_ticks',tick.id)}toast('Checklist bijgewerkt.')}catch(err){cb.checked=!cb.checked;toast(err.message||'Checklist niet opgeslagen.',true)}finally{cb.disabled=false}
 }
});
initialize();
</script></body></html>
